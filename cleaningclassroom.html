                    </svg>
                    <span>HOME</span>
                </a>
                    <a href="https://modrinth.com/" target="_blank" rel="noopener" 
                   class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/60 hover:border-cyan-500/50 text-xs font-semibold text-slate-200 transition-all duration-300 hover:-translate-y-1 shadow-md group">

                    </svg>

            </nav>
        </header>
        <main>
            <section class="bg-white/70 border border-white/90 rounded-2xl p-6 shadow-sm hover:shadow-md transition">
                <form class="flex flex-col gap-5 text-left">
                        <h1 class="text-3xl font-black text-sky-900 tracking-tight">STUDENT CLEANING FORM</h1>
                    <div>
                        <label for="name" class="block text-sm font-bold text-sky-900 mb-2">NAME:</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name"
                            placeholder="Your name" 
                            required 
                            class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors"
                        />
                    </div>
                    <div>
                        <label for="classroom" class="block text-sm font-bold text-sky-900 mb-2">CLASS</label>
                        <select id="classroom" name="classroom" required class="w-full px-3 py-2 text-xs bg-cyan-400 text-white rounded border border-sky-300 focus:ring-2 focus:ring-blue-200">
                        <option value="">SELECT A CLASSROOM</option>
                        <option value="class1" class="font-medium bg-sky-300">X-1</option>
                        <option value="class1" class="font-medium bg-sky-300">X-2</option>
                        <option value="class1" class="font-medium bg-sky-300">XI-1</option>
                        <option value="class1" class="font-medium bg-sky-300">XI-2</option>
                        </select>
                    </div>


                    <div>
                        <label for="datetime" class="block text-sm font-bold text-sky-900 mb-2">DAY & TIME:</label>
                        <input 
                            type="datetime-local" 
                            id="datetime" 
                            name="datetime"
                            required 
                            class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors"
                        />
                    </div>

                    <div>
                        <label for="task" class="block text-sm font-bold text-sky-900 mb-2">WHAT TASK THAT WAS DONE:</label>
                        <input 
                            type="text" 
                            id="task" 
                            name="task"
                            placeholder="What did you do?" 
                            required 
                            class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors"
                        />
                    </div>          

                    <button 
                        type="submit" 
                        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg shadow-md transition-colors capitalize mt-2">
                        Send Form
                    </button>
                </form>
            </section>
        </main>
            <footer>
                <p class="text-center text-gray-500 p-4">©DANZz Project | since 2011</p>
            </footer>

    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-700 overflow-hidden">
        <video autoplay loop muted playsinline class="absolute min-w-full min-h-full w-auto h-auto top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 object-cover opacity-60">
            <source src="bmw-m3-legend.3840x2160.mp4" type="video/mp4">
        </video>

        <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-[2px]"></div>

        <div class="relative z-10 flex flex-col items-center">
            <div class="relative flex items-center justify-center mb-4">
                <div class="w-20 h-20 border-4 border-slate-800/80 border-t-cyan-500 border-r-purple-500 rounded-full animate-spin"></div>
                <span class="absolute font-mono text-sm text-cyan-400 font-bold tracking-wider">DANZz</span>
            </div>
            <p class="text-xs font-mono text-slate-200 tracking-widest uppercase animate-pulse font-semibold drop-shadow-lg">
            BMW GERMANY           
        </p>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('loadingScreen');
                if (loader) {
                    loader.classList.add('opacity-0');
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 700);
                }
            }, 3000);
        });
    </script>

</body>
</html>
